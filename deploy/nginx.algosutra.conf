# /etc/nginx/sites-available/algosutra  (symlink into sites-enabled)
# Two server blocks: the React SPA and the API. TLS via certbot (certbot --nginx).

# ---- API ------------------------------------------------------------------
server {
    listen 80;
    server_name api.algosutra.co.in;

    client_max_body_size 6m;          # spreadsheets / images are capped at 5 MB in the app

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Socket.IO websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Judge requests can legitimately take a while (queue + compile + tests).
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # If the upstream is down, browsers still need CORS headers to show a readable error.
    error_page 502 503 504 = @upstream_down;
    location @upstream_down {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Vary Origin always;
        default_type application/json;
        return 503 '{"error":"The server is restarting. Please try again in a moment."}';
    }
}

# ---- Frontend (static build from codingPlatformReact/dist) -----------------
server {
    listen 80;
    server_name algosutra.co.in www.algosutra.co.in;

    root /var/www/algosutra;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA deep links (/student/exams/abc) must fall back to index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
